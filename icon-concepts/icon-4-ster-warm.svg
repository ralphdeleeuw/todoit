<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#92400e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fffbeb"/>
      <stop offset="100%" style="stop-color:#fef3c7"/>
    </linearGradient>
    <filter id="cardshadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#92400e" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg4)"/>

  <!-- Card/note shape -->
  <rect x="96" y="96" width="320" height="380" rx="24" fill="url(#cardGrad)" filter="url(#cardshadow)"/>

  <!-- Ruled lines on card -->
  <line x1="136" y1="195" x2="376" y2="195" stroke="#d97706" stroke-width="2" opacity="0.3"/>
  <line x1="136" y1="245" x2="376" y2="245" stroke="#d97706" stroke-width="2" opacity="0.3"/>
  <line x1="136" y1="295" x2="376" y2="295" stroke="#d97706" stroke-width="2" opacity="0.3"/>
  <line x1="136" y1="345" x2="376" y2="345" stroke="#d97706" stroke-width="2" opacity="0.3"/>

  <!-- Checkboxes + lines on card -->
  <!-- Row 1 checked -->
  <rect x="130" y="165" width="28" height="28" rx="6" fill="#16a34a"/>
  <polyline points="136,179 143,186 152,173" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="172" y1="179" x2="350" y2="179" stroke="#92400e" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Row 2 checked -->
  <rect x="130" y="215" width="28" height="28" rx="6" fill="#16a34a"/>
  <polyline points="136,229 143,236 152,223" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="172" y1="229" x2="330" y2="229" stroke="#92400e" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Row 3 open -->
  <rect x="130" y="265" width="28" height="28" rx="6" fill="none" stroke="#d97706" stroke-width="3"/>
  <line x1="172" y1="279" x2="360" y2="279" stroke="#92400e" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Row 4 open -->
  <rect x="130" y="315" width="28" height="28" rx="6" fill="none" stroke="#d97706" stroke-width="3"/>
  <line x1="172" y1="329" x2="320" y2="329" stroke="#92400e" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Star badge top-right of card -->
  <circle cx="364" cy="128" r="38" fill="#f59e0b"/>
  <text x="364" y="142" font-size="38" text-anchor="middle">⭐</text>
</svg>
