<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c2d12"/>
      <stop offset="100%" style="stop-color:#1c1917"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#9a3412;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#9a3412;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg1)"/>
  <!-- Flame glow -->
  <ellipse cx="256" cy="236" rx="180" ry="180" fill="url(#glow1)"/>
  <!-- Lion emoji via foreignObject -->
  <text x="256" y="320" font-size="280" text-anchor="middle" dominant-baseline="middle">🦁</text>
  <!-- Checkmark badge outer -->
  <circle cx="364" cy="364" r="74" fill="#166534"/>
  <!-- Checkmark badge inner -->
  <circle cx="364" cy="364" r="59" fill="#16a34a"/>
  <!-- Checkmark -->
  <polyline points="340,364 357,381 392,345" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
