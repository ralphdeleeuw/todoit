<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a"/>
      <stop offset="100%" style="stop-color:#064e3b"/>
    </linearGradient>
    <filter id="shadow3">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg3)"/>

  <!-- White circle -->
  <circle cx="256" cy="230" r="155" fill="white" opacity="0.12"/>
  <circle cx="256" cy="230" r="130" fill="white" opacity="0.1"/>

  <!-- Big checkmark -->
  <polyline points="156,230 220,294 360,154" stroke="white" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#shadow3)"/>

  <!-- App name -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-2" opacity="0.95">todoit</text>
</svg>
